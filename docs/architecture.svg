<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1100" width="850" height="1100">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="secondaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="warningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .node { fill: #1e293b; stroke-width: 2; filter: url(#shadow); }
    .line { stroke: #64748b; stroke-width: 2; fill: none; }
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 600; }
    .list-item { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #cbd5e1; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Request -->
  <rect x="60" y="40" width="320" height="60" rx="8" class="node" stroke="#64748b" />
  <text x="220" y="75" class="title" text-anchor="middle">Natural Language Request</text>

  <!-- Line 1 -->
  <line x1="220" y1="100" x2="220" y2="140" class="line" marker-end="url(#arrow)" />

  <!-- Intent Parser -->
  <rect x="60" y="150" width="320" height="70" rx="8" class="node" stroke="url(#primaryGlow)" />
  <text x="220" y="182" class="title" text-anchor="middle">Intent Parser</text>
  <text x="220" y="204" class="subtitle" text-anchor="middle">(LLM JSON-mode, heuristic fallback)</text>

  <!-- Line 2 -->
  <line x1="220" y1="220" x2="220" y2="270" class="line" marker-end="url(#arrow)" />
  <rect x="230" y="235" width="55" height="20" fill="#0f172a" rx="4" />
  <text x="235" y="249" class="label">Entities</text>

  <!-- Planner -->
  <rect x="60" y="280" width="320" height="70" rx="8" class="node" stroke="url(#primaryGlow)" />
  <text x="220" y="312" class="title" text-anchor="middle">Planner</text>
  <text x="220" y="334" class="subtitle" text-anchor="middle">(LLM DAG, template fallback)</text>

  <!-- Line 3 -->
  <line x1="220" y1="350" x2="220" y2="400" class="line" marker-end="url(#arrow)" />
  <rect x="230" y="365" width="240" height="20" fill="#0f172a" rx="4" />
  <text x="235" y="379" class="label">Plan shown to user BEFORE execution</text>

  <!-- Executor -->
  <rect x="60" y="410" width="320" height="70" rx="8" class="node" stroke="url(#primaryGlow)" />
  <text x="220" y="442" class="title" text-anchor="middle">Executor</text>
  <text x="220" y="464" class="subtitle" text-anchor="middle">(sequential + conditional, retries)</text>

  <!-- Lines branching from Executor -->
  <path d="M 220 480 L 220 540 L 410 540" class="line" marker-end="url(#arrow)" />
  <path d="M 220 540 L 220 710 L 410 710" class="line" marker-end="url(#arrow)" />
  <path d="M 220 710 L 220 850" class="line" marker-end="url(#arrow)" />

  <!-- Tool Registry -->
  <rect x="420" y="470" width="380" height="150" rx="8" class="node" stroke="url(#secondaryGlow)" />
  <text x="440" y="500" class="title">Tool Registry</text>
  <circle cx="445" cy="525" r="4" fill="#3b82f6" />
  <text x="460" y="529" class="list-item">mock supplier HTTP API :8001</text>
  <circle cx="445" cy="550" r="4" fill="#3b82f6" />
  <text x="460" y="554" class="list-item">weighted scorer (deterministic)</text>
  <circle cx="445" cy="575" r="4" fill="#3b82f6" />
  <text x="460" y="579" class="list-item">PO / document generator (fpdf2)</text>
  <circle cx="445" cy="600" r="4" fill="#3b82f6" />
  <text x="460" y="604" class="list-item">approval queue</text>

  <!-- Validator -->
  <rect x="420" y="650" width="400" height="130" rx="8" class="node" stroke="url(#secondaryGlow)" />
  <text x="440" y="680" class="title">Validator</text>
  <text x="440" y="700" class="subtitle">(budget / qty / consistency / completeness)</text>
  <text x="440" y="730" class="list-item">├─ pass → continue</text>
  <text x="440" y="755" class="list-item">└─ fail → self-correct (re-rank excluding bad</text>
  <text x="465" y="775" class="list-item">supplier) or escalate</text>

  <!-- Human Approval Gate -->
  <rect x="60" y="860" width="320" height="70" rx="8" class="node" stroke="url(#warningGlow)" />
  <text x="220" y="892" class="title" text-anchor="middle">Human Approval Gate</text>
  <text x="220" y="914" class="subtitle" text-anchor="middle">(mandatory — the agent never auto-approves spend)</text>

  <!-- Line 4 -->
  <line x1="220" y1="930" x2="220" y2="980" class="line" marker-end="url(#arrow)" />

  <!-- Stakeholder Report -->
  <rect x="60" y="990" width="320" height="70" rx="8" class="node" stroke="#64748b" />
  <text x="220" y="1022" class="title" text-anchor="middle">Stakeholder Completion Report</text>
  <text x="220" y="1044" class="subtitle" text-anchor="middle">+ Full Audit Log</text>
</svg>
