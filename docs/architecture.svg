<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" width="900" height="1160">
  <defs>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#f59e0b"/>
    </marker>
    <radialGradient id="radial" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1160" fill="#0a0f1a"/>
  <rect width="900" height="1160" fill="url(#grid)"/>
  <rect width="900" height="600" fill="url(#radial)"/>

  <!-- Title -->
  <text x="450" y="46" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">OrchestrAI</text>
  <text x="450" y="68" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Agentic Procurement Pipeline - HackHorizon 2026 PS2</text>

  <!-- NODE 1: Natural Language Request -->
  <rect x="275" y="90" width="350" height="62" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="275" y="90" width="6" height="62" rx="3" fill="url(#gSlate)"/>
  <text x="450" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Natural Language Request</text>
  <text x="450" y="138" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">User prompt to procurement intent</text>

  <!-- Arrow 1 to 2 -->
  <line x1="450" y1="152" x2="450" y2="192" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- NODE 2: Intent Parser -->
  <rect x="245" y="200" width="410" height="72" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="245" y="200" width="6" height="72" rx="3" fill="url(#gBlue)"/>
  <text x="450" y="228" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#93c5fd" text-anchor="middle">Intent Parser</text>
  <text x="450" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">LLM JSON-mode / heuristic fallback</text>
  <text x="450" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">item / quantity / budget / currency / suppliers_to_compare</text>

  <!-- Arrow 2 to 3 with Entities label -->
  <line x1="450" y1="272" x2="450" y2="312" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="458" y="281" width="62" height="18" rx="4" fill="#0a0f1a"/>
  <text x="489" y="293" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#3b82f6" text-anchor="middle" font-weight="600">Entities</text>

  <!-- NODE 3: Planner -->
  <rect x="245" y="318" width="410" height="72" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="245" y="318" width="6" height="72" rx="3" fill="url(#gPurple)"/>
  <text x="450" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#c4b5fd" text-anchor="middle">Planner</text>
  <text x="450" y="368" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">LLM DAG / template fallback</text>
  <text x="450" y="383" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Plan shown to user BEFORE execution</text>

  <!-- Arrow 3 to 4 -->
  <line x1="450" y1="390" x2="450" y2="430" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- NODE 4: Executor -->
  <rect x="245" y="436" width="410" height="64" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="245" y="436" width="6" height="64" rx="3" fill="url(#gBlue)"/>
  <text x="450" y="463" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#93c5fd" text-anchor="middle">Executor</text>
  <text x="450" y="483" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">sequential + conditional, retries</text>

  <!-- Branches to Tool Registry + Validator -->
  <path d="M 655 468 L 700 468 L 700 570 L 700 730" stroke="#10b981" stroke-width="2" fill="none"/>
  <line x1="700" y1="570" x2="740" y2="570" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="700" y1="730" x2="740" y2="730" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- NODE 5: Tool Registry -->
  <rect x="748" y="512" width="140" height="116" rx="10" fill="#0a1a14" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="818" y="534" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">Tool Registry</text>
  <circle cx="760" cy="550" r="3" fill="#10b981"/>
  <text x="768" y="554" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">fetch_suppliers (HTTP :8001)</text>
  <circle cx="760" cy="570" r="3" fill="#10b981"/>
  <text x="768" y="574" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">rank_suppliers (deterministic)</text>
  <circle cx="760" cy="590" r="3" fill="#10b981"/>
  <text x="768" y="594" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">generate_purchase_order (pdf)</text>
  <circle cx="760" cy="610" r="3" fill="#10b981"/>
  <text x="768" y="614" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#94a3b8">submit_for_approval</text>

  <!-- NODE 6: Validator -->
  <rect x="748" y="680" width="140" height="100" rx="10" fill="#0f1a0a" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="818" y="702" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">Validator</text>
  <text x="818" y="717" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">budget / qty / consistency</text>
  <text x="818" y="730" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">/ completeness</text>
  <text x="760" y="748" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#94a3b8">pass: continue</text>
  <text x="760" y="763" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#f87171">fail: self-correct or escalate</text>

  <!-- Down arrow from Executor to Human Gate (dashed amber) -->
  <line x1="450" y1="500" x2="450" y2="870" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <rect x="458" y="680" width="86" height="18" rx="4" fill="#0a0f1a"/>
  <text x="501" y="692" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle" font-weight="600">pending_approval</text>

  <!-- NODE 7: Human Approval Gate -->
  <rect x="245" y="876" width="410" height="72" rx="10" fill="#1a1200" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="245" y="876" width="6" height="72" rx="3" fill="url(#gAmber)"/>
  <text x="450" y="906" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Human Approval Gate</text>
  <text x="450" y="926" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#78716c" text-anchor="middle">Mandatory - agent never auto-approves spend</text>
  <text x="450" y="941" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" fill="#57534e" text-anchor="middle">approve: continue  /  reject: audit + stop</text>

  <!-- Arrow 7 to 8 -->
  <line x1="450" y1="948" x2="450" y2="988" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- NODE 8: Stakeholder Report -->
  <rect x="245" y="994" width="410" height="72" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="245" y="994" width="6" height="72" rx="3" fill="url(#gSlate)"/>
  <text x="450" y="1024" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#e2e8f0" text-anchor="middle">Stakeholder Completion Report</text>
  <text x="450" y="1044" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">Plain-language summary + Full audit log (SQLite events)</text>

  <!-- LLM Policy ribbon -->
  <rect x="32" y="1084" width="836" height="54" rx="8" fill="#0a0f1a" stroke="#1e293b" stroke-width="1"/>
  <text x="450" y="1105" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">LLM PROVIDER CHAIN</text>
  <text x="450" y="1124" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Gemini (free) then Groq (free) then SQLite cache then deterministic templates</text>

  <!-- Left sidebar legend -->
  <rect x="16" y="90" width="220" height="276" rx="8" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
  <text x="126" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.8">MOCK API - PORT 8001</text>
  <line x1="24" y1="118" x2="228" y2="118" stroke="#1e293b" stroke-width="1"/>
  <text x="26" y="135" font-family="monospace,Consolas" font-size="10" fill="#3b82f6">GET  /health</text>
  <text x="26" y="153" font-family="monospace,Consolas" font-size="10" fill="#3b82f6">GET  /quotes</text>
  <text x="26" y="171" font-family="monospace,Consolas" font-size="10" fill="#3b82f6">GET  /catalog</text>
  <text x="26" y="191" font-family="monospace,Consolas" font-size="9.5" fill="#475569">Chaos: timeout / malformed</text>
  <text x="26" y="205" font-family="monospace,Consolas" font-size="9.5" fill="#475569">  / over_budget</text>
  <line x1="24" y1="218" x2="228" y2="218" stroke="#1e293b" stroke-width="1"/>
  <text x="126" y="235" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.8">STEP IDs</text>
  <text x="26" y="252" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s1  fetch_suppliers</text>
  <text x="26" y="267" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s2  rank_suppliers</text>
  <text x="26" y="282" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s3  validate_selection</text>
  <text x="26" y="297" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s4  generate_purchase_order</text>
  <text x="26" y="312" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s5  submit_for_approval</text>
  <text x="26" y="327" font-family="monospace,Consolas" font-size="10" fill="#94a3b8">s6  compile_report</text>
  <text x="26" y="344" font-family="monospace,Consolas" font-size="9" fill="#475569">on_fail: retry|escalate|skip</text>
  <text x="26" y="358" font-family="monospace,Consolas" font-size="9" fill="#475569">max_retries: 2</text>
</svg>
